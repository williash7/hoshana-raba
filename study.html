<style>
:root{
  --k:1;
  --night:#181b2b; --night2:#22263a; --ink:#ecebe4; --muted:#9aa0b8;
  --willow:#86a86a; --gold:#d9ad55;
  --paper:#efe6d1; --pagebg:#e4dbc4; --text:#1f1a12; --textmuted:#8a7a5a; --rule:#c9b98f; --rashi:#3b3326;
  --ui:"Assistant","Segoe UI",Arial,sans-serif;
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;
  --rashiF:"Noto Rashi Hebrew","Frank Ruhl Libre",serif;
  --fs:calc(23px*var(--k)); --pw:calc(600px*var(--k));
}
:root[data-theme="dark"]{ --pagebg:#0f0e0b; --paper:#16140f; --text:#e6dcc6; --textmuted:#a39370; --rule:#4a4130; --rashi:#cfc3a8; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pagebg:#0f0e0b; --paper:#16140f; --text:#e6dcc6; --textmuted:#a39370; --rule:#4a4130; --rashi:#cfc3a8; } }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--pagebg);font-family:var(--ui);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:calc(2px*var(--k)) solid var(--gold);outline-offset:calc(2px*var(--k))}

.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--night);padding:calc(env(safe-area-inset-top,calc(0px*var(--k))) + calc(8px*var(--k))) calc(14px*var(--k)) 0;box-shadow:0 calc(1px*var(--k)) 0 #0006}
.row1{display:flex;align-items:center;justify-content:space-between;gap:calc(10px*var(--k));max-width:calc(760px*var(--k));margin:0 auto}
.day{display:flex;align-items:center;gap:calc(6px*var(--k));min-width:0}
.day .arrow{width:calc(36px*var(--k));height:calc(36px*var(--k));border-radius:50%;border:0;background:var(--night2);font-size:calc(18px*var(--k));line-height:1;flex:none}
.day .arrow:disabled{opacity:.3}
.day .dt{text-align:center;min-width:0}
.day .dt b{display:block;font-family:var(--serif);font-size:calc(21px*var(--k));color:var(--gold);white-space:nowrap}
.day .dt span{display:block;font-size:calc(12.5px*var(--k));color:var(--muted);white-space:nowrap}
.where{text-align:left;min-width:0}
.where .sec{font-family:var(--serif);font-weight:700;font-size:calc(16px*var(--k));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(150px*var(--k))}
.where .pct{font-size:calc(12.5px*var(--k));color:var(--muted);white-space:nowrap}
.today{border:calc(1px*var(--k)) solid #4a4f6b;background:transparent;border-radius:calc(14px*var(--k));padding:calc(3px*var(--k)) calc(10px*var(--k));font-size:calc(12.5px*var(--k));margin-top:calc(3px*var(--k))}
.bar{position:relative;height:calc(6px*var(--k));margin:calc(8px*var(--k)) auto 0;max-width:calc(760px*var(--k));background:#34384f;border-radius:calc(3px*var(--k))}
.bar .fill{position:absolute;top:0;bottom:0;right:0;background:var(--willow);border-radius:calc(3px*var(--k))}
.eta{max-width:calc(760px*var(--k));margin:0 auto;padding:calc(5px*var(--k)) 0 calc(7px*var(--k));font-size:calc(12.5px*var(--k));color:var(--muted);display:flex;justify-content:space-between;gap:calc(8px*var(--k))}
.eta b{color:var(--ink);font-weight:600}

#scroller{padding-bottom:calc(var(--dockH,calc(76px*var(--k))) + 55vh)}
#doc{margin:0 auto;width:min(100%, var(--pw))}
.t{background:var(--paper);color:var(--text);font-family:var(--serif);padding:0 calc(20px*var(--k))}
.t.head{padding-top:calc(26px*var(--k));padding-bottom:calc(8px*var(--k));text-align:center}
.t.head h3{font-size:calc(var(--fs) * 1.2);margin:0;font-weight:700}
.t.head small{display:block;font-family:var(--ui);font-size:calc(13px*var(--k));color:var(--textmuted);margin-top:calc(2px*var(--k))}
.t.ps{padding-top:calc(10px*var(--k));padding-bottom:calc(4px*var(--k))}
.t.ps p{margin:0;font-size:var(--fs);line-height:1.8;text-align:justify;font-weight:500}
.t.ps .v{font-family:var(--ui);font-size:.55em;color:var(--textmuted);font-weight:700;margin-left:calc(4px*var(--k));vertical-align:.25em}
.t.ps .ch{display:block;text-align:center;font-weight:700;font-size:calc(var(--fs) * .8);color:var(--textmuted);margin:calc(6px*var(--k)) 0 calc(4px*var(--k))}
.rashi{margin:calc(6px*var(--k)) 0 calc(4px*var(--k));padding:calc(6px*var(--k)) calc(10px*var(--k)) calc(6px*var(--k)) 0;border-right:calc(2px*var(--k)) solid var(--rule);font-family:var(--rashiF);font-size:calc(var(--fs) * .68);line-height:1.75;color:var(--rashi);text-align:justify}
.rashi div+div{margin-top:calc(4px*var(--k))}
.rashi b{font-weight:600;color:var(--text)}
:root.norashi .rashi{display:none}
.t.par{padding-top:calc(6px*var(--k));padding-bottom:calc(6px*var(--k))}
.t.par p{margin:0;font-size:var(--fs);line-height:1.85;text-align:justify;font-weight:500}
.t.msg{padding:calc(40px*var(--k)) calc(22px*var(--k));text-align:center;font-family:var(--ui);color:var(--textmuted);font-size:calc(15px*var(--k));line-height:1.6}
.dbg{direction:ltr;font-size:calc(11px*var(--k));color:#a05a4a;margin-top:calc(10px*var(--k));word-break:break-all}
.t.msg button{margin-top:calc(12px*var(--k));border:0;background:var(--night);color:var(--gold);font-weight:700;border-radius:calc(12px*var(--k));padding:calc(10px*var(--k)) calc(18px*var(--k));font-size:calc(15px*var(--k))}
.t.end{padding:calc(30px*var(--k)) calc(20px*var(--k)) calc(34px*var(--k));text-align:center;font-family:var(--ui);color:var(--textmuted);font-size:calc(14px*var(--k));border-top:calc(1px*var(--k)) solid var(--rule)}
.t.end b{display:block;font-family:var(--serif);font-size:calc(22px*var(--k));color:var(--text);margin-bottom:calc(4px*var(--k))}
.t.end a{display:inline-block;margin-top:calc(14px*var(--k));text-decoration:none;background:var(--night);color:var(--gold);font-weight:700;border-radius:calc(12px*var(--k));padding:calc(10px*var(--k)) calc(18px*var(--k));font-size:calc(15px*var(--k))}
.src{font-family:var(--ui);font-size:calc(12px*var(--k));color:var(--textmuted);text-align:center;padding:calc(10px*var(--k)) 0 0}

.shade{position:fixed;left:0;right:0;z-index:5;pointer-events:none;background:linear-gradient(to bottom, rgba(24,27,43,0), rgba(24,27,43,.18))}
.line{position:fixed;left:0;right:0;z-index:6;height:0;pointer-events:none}
.line::before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:calc(2px*var(--k)) solid var(--gold);opacity:.85}
.line .tab{position:absolute;right:0;top:-12px;background:var(--gold);color:#241c08;font-size:calc(12px*var(--k));font-weight:700;padding:calc(2px*var(--k)) calc(9px*var(--k)) calc(2px*var(--k)) calc(8px*var(--k));border-radius:0 0 0 calc(10px*var(--k))}

.dock{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--night);padding:calc(8px*var(--k)) calc(12px*var(--k)) calc(env(safe-area-inset-bottom,calc(0px*var(--k))) + calc(8px*var(--k)));box-shadow:0 -1px 0 #0006}
.dock-in{max-width:calc(760px*var(--k));margin:0 auto;display:flex;align-items:center;gap:calc(10px*var(--k))}
.play{width:calc(56px*var(--k));height:calc(56px*var(--k));border-radius:50%;border:0;background:var(--gold);color:#241c08;display:grid;place-items:center;flex:none}
.play svg{width:calc(24px*var(--k));height:calc(24px*var(--k))}
.speed{display:flex;align-items:center;background:var(--night2);border-radius:calc(28px*var(--k));padding:calc(4px*var(--k));flex:1;min-width:0;justify-content:space-between}
.speed button{width:calc(50px*var(--k));height:calc(44px*var(--k));border:0;border-radius:calc(22px*var(--k));background:transparent;font-size:calc(14px*var(--k));font-weight:600}
.speed .val{text-align:center;line-height:1.1}
.speed .val b{font-size:calc(19px*var(--k));font-variant-numeric:tabular-nums}
.speed .val span{display:block;white-space:nowrap;font-size:calc(11.5px*var(--k));color:var(--muted)}
.ctl{height:calc(48px*var(--k));min-width:calc(48px*var(--k));border-radius:calc(24px*var(--k));border:calc(1.5px*var(--k)) solid #4a4f6b;background:transparent;padding:0 calc(10px*var(--k));font-size:calc(15px*var(--k));font-weight:600;flex:none;display:grid;place-items:center;text-decoration:none}
.today.pill.on{border-color:var(--gold);color:var(--gold)}
.ctl.on{border-color:var(--gold);color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH,calc(76px*var(--k))) + calc(18px*var(--k)));z-index:25;background:#2c3046;color:var(--ink);padding:calc(9px*var(--k)) calc(16px*var(--k));border-radius:calc(20px*var(--k));font-size:calc(14px*var(--k));opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (max-width:380px){ .day .dt b{font-size:calc(18px*var(--k))} .ctl{min-width:calc(42px*var(--k));padding:0 calc(7px*var(--k))} .speed button{width:calc(42px*var(--k))} }
</style>
</head>

<header class="top" id="top">
  <div class="row1">
    <div class="day">
      <button class="arrow" id="prev" aria-label="יום קודם">›</button>

<div class="line" id="line"><span class="tab">כאן</span></div>

      <div class="val"><b id="spd">2.0</b><span>דק׳ לעמוד</span></div>
      <button id="faster">מהר</button>
    </div>
    <button class="ctl" id="font" aria-label="גודל אותיות">א</button>
    <a class="ctl" href="./" aria-label="מסך הבית"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
  </div>
</nav>

async function loadChumash(){ const c=chumashFor(dayDate(),!!HOME.diaspora);
  if(!c){ showMsg('לא נמצא שיעור חומש לתאריך הזה.'); return; }
  $('title').textContent='חומש · '+c.he; $('sub').textContent='יום '+WEEKDAYS[c.aliyah]+' – '+c.aliyahName; document.title='חומש '+c.he+' – '+c.aliyahName;
  const seq=loadSeq;
  const data=await Promise.all(c.refs.map(r=>Promise.all([sefText(r.ref,"hebrew|Tanach with Ta'amei Hamikra"), sefText('Rashi on '+r.ref,'hebrew').catch(()=>null)])));
  if(seq!==loadSeq) return;
  $('doc').innerHTML=''; B=[]; MARK=[];
  c.refs.forEach((r,ri)=>{ const [txt,ra]=data[ri]; const verses=toVerses(txt); const rv={}; if(ra) toVerses(ra).forEach(x=>{ rv[x.ch+':'+x.v]=flat(x.val); });
    block('head','<h3>פרשת '+r.parsha+' – '+c.aliyahName+'</h3><small>'+(txt.heRef||r.ref)+'</small>',2,'פרשת '+r.parsha);
    let lastCh=null;
    verses.forEach(x=>{ const vtxt=clean(flat(x.val).join(' ')); const com=(rv[x.ch+':'+x.v]||[]).map(clean).filter(Boolean);
      let h=''; if(x.ch!==lastCh){ h+='<span class="ch">פרק '+gem(x.ch)+'</span>'; lastCh=x.ch; }
      h+='<p><span class="v">'+gem(x.v)+'</span>'+vtxt+'</p>';
      if(com.length) h+='<div class="rashi">'+com.map(s=>'<div>'+s+'</div>').join('')+'</div>';
      block('ps',h,words(vtxt)+(D.rashi?words(com.join(' '))*0.8:0),gem(x.ch)+':'+gem(x.v)); });
  });
  const h=document.createElement('div'); h.className='src'; h.textContent='הטקסט מספריא (Sefaria)'; B[B.length-1].el.appendChild(h);
  finish('<b>סיום חומש היום</b>'+(c.aliyah<6?'פרשת '+c.he+' – '+c.aliyahName:'')+'<br><a href="./">חזרה למסך הבית</a>'); }

  const d=dayDate(); $('hdate').textContent=(off===0?'היום ':'')+WEEKDAYS[d.getDay()]+' · '+hebOf(d).label;
  showMsg('טוען…');
  try{ if(MOD==='chumash') await loadChumash(); else if(MOD==='korbanot') await loadKorbanot(); else await loadTanya(); }
  catch(e){ showMsg('לא הצלחתי לטעון את הטקסט.<br>בדוק שיש חיבור לאינטרנט ונסה שוב.<div class="dbg">'+String(e&&e.message||e).replace(/[<>&]/g,'')+'<br>'+LASTURL.replace(/[<>&]/g,'').slice(0,140)+'</div>',true); return; }
  if(B.length<=2) showMsg('הטקסט נטען אבל התקבל ריק.<div class="dbg">'+LASTURL.replace(/[<>&]/g,'').slice(0,140)+'</div>',true);
  measure(); const p=D.pos[dkey()]||0; scrollToPos(p); ready=true; update();
  if(p>3) toast('ממשיכים מאיפה שעצרת');
  setTimeout(()=>{ if(!playing){ const q=curPos; measure(); scrollToPos(q); } },400); }

/* ---------- geometry ---------- */
let curPos=0;
function measure(){ tops=B.map(b=>b.el.offsetTop); hts=B.map(b=>b.el.offsetHeight);
  const t=$('top').offsetHeight, b=$('dock').offsetHeight; $('scroller').style.paddingTop=t+'px'; root.style.setProperty('--dockH',b+'px'); placeLine(); }
function lineY(){ const t=$('top').offsetHeight,b=$('dock').offsetHeight; return t+(innerHeight-t-b)*0.28; }
function placeLine(){ const y=lineY(),t=$('top').offsetHeight; $('line').style.top=y+'px'; $('shade').style.top=t+'px'; $('shade').style.height=Math.max(0,y-t)+'px'; }
function idxY(y){ let lo=0,hi=B.length-1; while(lo<hi){const m=(lo+hi+1)>>1; if(tops[m]<=y) lo=m; else hi=m-1;} return lo; }
function idxP(p){ let lo=0,hi=B.length-1; while(lo<hi){const m=(lo+hi+1)>>1; if(B[m].cum<=p) lo=m; else hi=m-1;} return lo; }
function posFromScroll(){ if(!B.length) return 0; const y=scrollY+lineY(), i=idxY(y), f=Math.max(0,Math.min(1,(y-tops[i])/(hts[i]||1))); return Math.min(TOTAL,B[i].cum+f*B[i].w); }
function scrollToPos(p){ if(!B.length) return; p=Math.max(0,Math.min(TOTAL-0.01,p)); const i=idxP(p); scrollTo(0,Math.max(0,tops[i]+(p-B[i].cum)/B[i].w*hts[i]-lineY())); curPos=p; }

/* ---------- auto scroll (speed: minutes per ~170 words) ---------- */
const PW=170; let playing=false,last=0,accY=null,touching=false,wake=null;
const wpm=()=>PW/D.mpp;
function frame(t){ if(!playing) return; const dt=last?Math.min(0.1,(t-last)/1000):0; last=t;
  if(accY===null||Math.abs(scrollY-accY)>4) accY=scrollY;
  if(!touching){ const i=idxP(curPos); accY+=hts[i]/B[i].w*wpm()/60*dt; scrollTo(0,accY); }
  if(curPos>=TOTAL-2.5 || accY>=document.documentElement.scrollHeight-innerHeight-2){ setPlaying(false); return; }
  requestAnimationFrame(frame); }
async function setPlaying(v){ playing=v; last=0; accY=null;
  $('playIco').innerHTML=v?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>':'<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>';
  if(v){ requestAnimationFrame(frame); try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} } else { try{wake&&wake.release();}catch(e){} wake=null; } }
addEventListener('touchstart',e=>{ if(!e.target.closest('.dock,.top')) touching=true; },{passive:true});
addEventListener('touchend',()=>{touching=false;accY=null;},{passive:true});
$('play').onclick=()=>{ if(!ready) return; if(!playing && curPos>=TOTAL-2.5){ scrollToPos(0); } setPlaying(!playing); };
function setMpp(v){ D.mpp=Math.round(Math.max(0.3,Math.min(12,v))*10)/10; $('spd').textContent=D.mpp.toFixed(1); save(); update(); }
$('slower').onclick=()=>setMpp(D.mpp+(D.mpp>=3?0.5:0.1));
$('faster').onclick=()=>setMpp(D.mpp-(D.mpp>3?0.5:0.1));
const SIZES=[19,23,27,31]; $('font').onclick=()=>{ const p=curPos; const i=(SIZES.indexOf(D.fs)+1)%SIZES.length; D.fs=SIZES[i]; root.style.setProperty('--fs',(D.fs*K)+'px'); measure(); scrollToPos(p); save(); };
$('rashiBtn').onclick=()=>{ D.rashi=!D.rashi; save(); rashiUI(); load(); toast(D.rashi?'רש״י מוצג':'רש״י מוסתר'); };
$('prev').onclick=()=>{ off--; load(); }; $('next').onclick=()=>{ off++; load(); }; $('today').onclick=()=>{ off=0; load(); };

/* ---------- status ---------- */
let toastT; function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
function update(){ if(!ready){ $('fill').style.width='0%'; $('left').textContent=''; $('pct').textContent=''; $('cur').textContent=''; return; }
  const p=curPos, done=Math.min(1,p/TOTAL); $('fill').style.width=(done*100)+'%';
  let cur=MARK[0]; MARK.forEach(x=>{ if(B[x.i].cum<=p+0.3) cur=x; }); $('cur').textContent=cur?(MOD==='chumash'&&!/^פרשת/.test(cur.label)?'פסוק '+cur.label:cur.label):'';
  const left=Math.max(0,TOTAL-p);
  $('left').innerHTML = left<3 ? '<b>✓ סיימת להיום</b>' : 'נשאר כ־<b>'+Math.max(1,Math.round(left/wpm()))+' דק׳</b>';
  const U=MARK.filter(x=>!/^פרשת|^קרבנות$|^תניא$/.test(x.label)), un=U.filter(x=>B[x.i].cum+B[x.i].w<=p+0.5).length, ut=U.length, unit=MOD==='chumash'?'פסוקים':MOD==='tanya'?'קטעים':'חלקים';
  $('pct').textContent=progTxt(left<3?1:done,left<3?ut:un,ut,unit);
  if(off===0) setProgress(MOD,dkey(),left<3?1:done,left<3?ut:un,ut,unit);
  if(off<=0 && -off<=new Date().getDay()) wkSet((MOD==='chumash'?'chu:':'tan:')+dayDate().getDay(), left<3?1:done); }
addEventListener('scroll',()=>{ if(!ready) return; curPos=posFromScroll(); D.pos[dkey()]=curPos; update(); },{passive:true});
setInterval(save,3000); addEventListener('pagehide',save);
addEventListener('resize',()=>{ if(!ready) return; const p=curPos; computeK(); root.style.setProperty('--fs',(D.fs*K)+'px'); root.style.setProperty('--pw',(600*K)+'px'); measure(); scrollToPos(p); });
// keep only recent bookmarks
(function(){ const ks=Object.keys(D.pos).sort(); while(ks.length>14) delete D.pos[ks.shift()]; })();

root.style.setProperty('--fs',(D.fs*K)+'px'); root.style.setProperty('--pw',(600*K)+'px'); $('spd').textContent=D.mpp.toFixed(1); rashiUI();
requestAnimationFrame(load);
</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
