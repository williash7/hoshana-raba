<!doctype html>
<html lang="he" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181b2b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לימוד יומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --k:1;
  --bg:#181b2b; --bg2:#141726; --sf:#22263a; --sf2:#2a2f47; --ln:#2e3350; --ln2:#3a3f58;
  --ink:#ecebe4; --mut:#a3a9c0; --gold:#d9ad55; --gold2:#2c2a1e; --ok:#86a86a; --warn:#e8a06a;
  --ui:"Assistant","Segoe UI",Arial,sans-serif;
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;
  --navH:calc(62px*var(--k));
}
html{font-size:calc(16px*var(--k))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;min-height:100vh}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + .9rem) 1rem .6rem;display:flex;align-items:center;gap:.6rem}
.top .tt{flex:1;min-width:0}
.top .dl{font-size:.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .dl b{color:var(--gold);font-family:var(--serif);font-size:1rem}
.top h1{margin:.1rem 0 0;font-family:var(--serif);font-size:1.75rem;line-height:1.15}
.ib{width:2.75rem;height:2.75rem;border-radius:.8rem;border:1px solid var(--ln2);background:var(--sf);display:grid;place-items:center;flex:none;text-decoration:none}
.ib svg{width:1.3rem;height:1.3rem}
main{max-width:40rem;margin:0 auto;padding:0 .9rem calc(var(--navH) + 1.5rem + env(safe-area-inset-bottom,0px))}
body.v-today main{padding-bottom:calc(var(--navH) + 11rem + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;background:var(--bg2);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;height:var(--navH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:.78rem;color:var(--mut);text-decoration:none}
nav.tabs a svg{width:1.5rem;height:1.5rem}
nav.tabs a.on{color:var(--gold)}

/* shared bits */
.bar{height:.4rem;border-radius:.2rem;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.ok{background:var(--ok)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:1rem;padding:.9rem 1rem;margin-bottom:.75rem}
.card h2{margin:0;font-family:var(--serif);font-size:1.3rem}
.card .what{font-size:.88rem;color:var(--mut);margin-top:.15rem}
.card .pr{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
.card .pr .bar{flex:1}
.card .pr span{font-size:.8rem;color:var(--mut);white-space:nowrap}
.card.done{border-color:#4d6340}
.card.now{border-color:var(--gold)}
.card.season{background:var(--gold);color:#241c08;border-color:var(--gold);display:block;text-decoration:none}
.card.season .what{color:#3b2e10}
.btns{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.b{min-height:2.5rem;padding:0 .9rem;border-radius:.65rem;border:1px solid var(--ln2);background:transparent;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:.3rem}
.b.main{background:var(--gold);border-color:var(--gold);color:#241c08}
.b.sm{min-height:2.1rem;padding:0 .65rem;font-size:.82rem;font-weight:600}
.b.ghost{border-color:transparent;color:var(--gold);padding:0 .3rem}
.lnk{color:var(--gold);font-size:.85rem;background:none;border:0;padding:.3rem 0;text-decoration:underline}
.sec{font-size:.8rem;font-weight:700;color:var(--mut);margin:1.1rem .2rem .45rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.sec .acts{display:flex;gap:.3rem}
.note{font-size:.88rem;color:var(--mut);line-height:1.5}
.note b{color:var(--ink)}
.ok-t{color:var(--ok);font-weight:600}
.bad-t{color:var(--warn);font-weight:600}

/* plan list (today) */
.dayp{display:flex;align-items:center;gap:.6rem;margin:.1rem .2rem .3rem;font-size:.85rem;color:var(--mut)}
.dayp .bar{flex:1}
.dayp b{color:var(--gold)}
.plist{position:relative}
.prow{display:flex;align-items:center;gap:.5rem;min-height:3.2rem;padding:.35rem .5rem .35rem .3rem;border-radius:.8rem;background:var(--sf);margin-bottom:.35rem;border:1px solid transparent;touch-action:pan-y}
.prow.below{opacity:.5}
.prow.drag{position:relative;z-index:5;border-color:var(--gold);box-shadow:0 .4rem 1.2rem rgba(0,0,0,.45);opacity:1}
.prow .cb{width:1.6rem;height:1.6rem;border-radius:.45rem;border:2px solid #4a5070;background:transparent;flex:none;display:grid;place-items:center;padding:0;margin-inline-start:.2rem}
.prow .cb.on{background:var(--gold);border-color:var(--gold)}
.prow .cb svg{width:.9rem;height:.9rem}
.prow .nm{flex:1;min-width:0;background:none;border:0;padding:.2rem 0;text-align:right;display:block}
.prow .nm b{display:block;font-size:1rem;font-weight:700;line-height:1.25}
.prow .nm small{display:block;font-size:.78rem;color:var(--mut);line-height:1.3;margin-top:.05rem}
.prow .nm small.part{color:var(--gold)}
.prow .tm{font-size:.82rem;color:var(--mut);white-space:nowrap;flex:none}
.prow .mo{width:2.2rem;height:2.4rem;border:0;background:none;color:var(--mut);font-size:1.2rem;flex:none;padding:0;letter-spacing:-1px}
.prow .hd{width:1.9rem;height:2.6rem;display:grid;place-items:center;color:#5d6386;flex:none;touch-action:none;cursor:grab}
.prow .hd svg{width:1rem;height:1.2rem}
.cut{display:flex;align-items:center;gap:.5rem;margin:.55rem 0 .6rem;color:var(--gold);font-size:.8rem;font-weight:700;text-align:center}
.cut::before,.cut::after{content:"";flex:1;height:2px;background:var(--gold);border-radius:1px}
.empty{padding:1rem;border:1px dashed var(--ln2);border-radius:.9rem;text-align:center;color:var(--mut);font-size:.92rem;line-height:1.5}

details.grp{background:var(--sf);border:1px solid var(--ln);border-radius:.9rem;margin-bottom:.5rem;overflow:hidden}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:.5rem;padding:.75rem .9rem;cursor:pointer;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary small{font-weight:400;color:var(--mut);font-size:.8rem}
details.grp>summary .ch{margin-inline-start:auto;color:var(--mut);transition:transform .15s}
details.grp[open]>summary .ch{transform:rotate(-90deg)}
.arow{display:flex;align-items:center;gap:.55rem;min-height:2.9rem;padding:.25rem .9rem;border-top:1px solid var(--ln)}
.arow .cb{width:1.5rem;height:1.5rem;border-radius:.4rem;border:2px solid #4a5070;background:transparent;flex:none;padding:0}
.arow .nm{flex:1;min-width:0;font-size:.95rem;background:none;border:0;text-align:right;padding:.3rem 0}
.arow .nm small{display:block;font-size:.76rem;color:var(--mut)}
.arow .tm{font-size:.8rem;color:var(--mut);white-space:nowrap}
.subh{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.55rem .9rem;border-top:1px solid var(--ln);font-size:.88rem;font-weight:700;background:#1e2235}
.subh small{font-weight:400;color:var(--mut)}
details.sub{border-top:1px solid var(--ln)}
details.sub>summary{list-style:none;padding:.55rem .9rem;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;gap:.4rem;align-items:center;background:#1e2235}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary small{font-weight:400;color:var(--mut)}

/* action area (today) */
.act{position:fixed;inset:auto 0 calc(var(--navH) + env(safe-area-inset-bottom,0px)) 0;z-index:25;background:var(--bg2);border-top:1px solid var(--ln);padding:.6rem .9rem .65rem}
.act-in{max-width:40rem;margin:0 auto}
.tseg{display:flex;gap:.2rem;background:var(--sf);border-radius:.75rem;padding:.2rem}
.tseg button{flex:1;min-height:2.6rem;border:0;background:transparent;color:var(--mut);border-radius:.6rem;font-size:.88rem;font-weight:600;padding:0 .2rem}
.tseg button.on{background:var(--gold);color:#241c08}
.tctl{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:.3rem;align-items:center;margin-top:.45rem;scrollbar-width:none;padding-bottom:.1rem}
.tctl::-webkit-scrollbar{display:none}
.tctl>*{flex:none}
.tctl:empty{display:none}
.tctl button{min-height:2.2rem;border:1px solid var(--ln2);background:transparent;border-radius:1.1rem;padding:0 .7rem;font-size:.85rem}
.tctl button.on{background:var(--gold2);border-color:var(--gold);color:var(--gold)}
.tctl input{min-height:2.2rem;width:5.2rem;border:1px solid var(--ln2);background:var(--sf);border-radius:.6rem;padding:0 .5rem;font-size:.9rem}
.tctl input[type=time]{width:auto}
.tctl span{font-size:.85rem;color:var(--mut)}
.sumL{font-size:.84rem;color:var(--mut);margin-top:.4rem;line-height:1.4;min-height:1.2em}
.sumL b{color:var(--ink)}
.go{margin-top:.45rem;width:100%;min-height:3.2rem;border:0;border-radius:.9rem;background:var(--gold);color:#241c08;font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.go small{font-size:.85rem;font-weight:600}
.go:disabled{opacity:.4}

/* progress grid */
.wk{display:flex;align-items:center;gap:.4rem;margin:.2rem 0 .8rem}
.wk b{flex:1;text-align:center;font-size:1rem}
.wk button{min-width:2.75rem;min-height:2.6rem;border:1px solid var(--ln2);background:var(--sf);border-radius:.7rem}
.wk button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:5.6rem repeat(7,minmax(0,1fr));gap:.3rem;align-items:center}
.grid .h{font-size:.78rem;color:var(--mut);text-align:center;font-weight:700}
.grid .h.td{color:var(--gold)}
.grid .l{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.c{height:2.1rem;border-radius:.5rem;border:1px solid var(--ln);background:var(--sf);padding:0;position:relative;overflow:hidden}
.grid .c.d{background:var(--ok);border-color:var(--ok)}
.grid .c.p i{position:absolute;inset:auto 0 0 0;background:var(--gold)}
.grid .c.p{border-color:var(--gold)}
.grid .c.m{border:2px dashed var(--warn);background:transparent}
.grid .c.fu{opacity:.35}
.grid .c.td{outline:2px solid var(--gold);outline-offset:1px}
.grid .c.na{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.78rem;color:var(--mut);margin:.7rem .1rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.legend i{width:.9rem;height:.9rem;border-radius:.25rem;display:inline-block}

/* settings */
.sg{background:var(--sf);border:1px solid var(--ln);border-radius:.9rem;overflow:hidden}
.sr{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:3.1rem;padding:.4rem .9rem;border-top:1px solid var(--ln);font-size:.95rem}
.sr:first-child{border-top:0}
.sr>span{flex:1;min-width:0}
.sr small{display:block;color:var(--mut);font-size:.78rem}
.sr input[type=checkbox]{width:1.35rem;height:1.35rem;accent-color:var(--gold);flex:none}
.sr a{color:var(--gold);text-decoration:none;font-size:.9rem;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:.6rem;padding:.15rem;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.4rem .65rem;border-radius:.5rem;font-size:.84rem;color:var(--mut)}
.seg button.on{background:var(--gold);color:#241c08;font-weight:600}
.ord{display:flex;gap:.2rem}
.ord button{width:2.1rem;height:2.1rem;border:1px solid var(--ln2);background:transparent;border-radius:.5rem;color:var(--mut);font-size:.75rem;padding:0}
.ord button:disabled{opacity:.25}
.foot{font-size:.78rem;color:var(--mut);text-align:center;margin:1.2rem .5rem 0;line-height:1.5}
.inst ol{margin:.4rem 0 .2rem;padding-inline-start:1.2rem;font-size:.85rem;line-height:1.6;color:var(--mut)}

/* sheet + toast */
.shade{position:fixed;inset:0;z-index:50;background:rgba(5,6,12,.6)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:51;background:var(--sf);border-radius:1.2rem 1.2rem 0 0;padding:.6rem .9rem calc(1rem + env(safe-area-inset-bottom,0px));max-width:40rem;margin:0 auto}
.sheet .grab{width:2.8rem;height:.3rem;border-radius:.2rem;background:#4a5070;margin:0 auto .6rem}
.sheet h3{margin:0 0 .5rem;font-family:var(--serif);font-size:1.2rem}
.sheet button.it{display:block;width:100%;text-align:right;min-height:3rem;border:0;border-top:1px solid var(--ln);background:none;font-size:1rem;padding:0 .3rem}
.sheet button.it:first-of-type{border-top:0}
.toast{position:fixed;inset:auto 1rem calc(var(--navH) + 12rem) 1rem;z-index:60;max-width:30rem;margin:0 auto;background:#0d0f1a;border:1px solid var(--ln2);color:var(--ink);border-radius:.8rem;padding:.7rem .9rem;font-size:.92rem;text-align:center;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.5)}
@media (min-width:44rem){ .top h1{font-size:2rem} }
</style>
</head>

</nav>
