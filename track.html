<script type="module">
const $=id=>document.getElementById(id);
computeK();
TW={"cw": [57, 77, 63, 68, 98, 74, 124, 66, 150, 147, 62, 72, 48, 64, 44, 78, 116, 345, 113, 62, 92, 224, 50, 81, 133, 73, 126, 80, 81, 87, 200, 99, 137, 139, 203, 81, 259, 144, 108, 168, 104, 114, 46, 173, 139, 87, 64, 100, 144, 149, 137, 82, 67, 58, 175, 107, 94, 85, 134, 102, 60, 96, 81, 74, 101, 131, 49, 295, 251, 43, 174, 140, 171, 174, 77, 78, 141, 473, 115, 124, 111, 51, 109, 101, 83, 128, 47, 131, 341, 125, 99, 100, 41, 146, 77, 95, 84, 67, 77, 36, 70, 183, 141, 233, 256, 288, 253, 85, 201, 55, 68, 72, 51, 47, 118, 109, 12, 178, 946, 42, 46, 57, 35, 54, 43, 45, 49, 43, 50, 47, 27, 109, 29, 20, 144, 159, 68, 62, 160, 104, 81, 68, 102, 120, 126, 74, 126, 87, 57, 34], "v119": [5, 5, 5, 5, 5, 4, 6, 4, 5, 4, 6, 5, 4, 5, 4, 5, 5, 4, 6, 5, 5, 7, 8, 4, 5, 5, 4, 5, 5, 4, 4, 5, 6, 5, 5, 4, 6, 5, 7, 5, 5, 5, 7, 5, 5, 6, 4, 6, 5, 6, 6, 5, 5, 5, 6, 5, 5, 5, 5, 5, 6, 7, 6, 6, 5, 7, 7, 4, 8, 6, 5, 5, 6, 6, 6, 5, 5, 7, 5, 6, 5, 6, 6, 6, 6, 5, 6, 5, 5, 6, 6, 6, 6, 5, 6, 7, 5, 6, 6, 5, 7, 4, 5, 6, 4, 5, 5, 6, 6, 7, 6, 6, 4, 5, 5, 5, 5, 5, 6, 5, 5, 5, 5, 5, 4, 5, 5, 7, 5, 5, 5, 5, 5, 5, 5, 6, 5, 5, 5, 5, 6, 5, 4, 5, 6, 4, 5, 5, 6, 5, 5, 6, 5, 5, 6, 5, 6, 7, 6, 5, 6, 6, 5, 6, 6, 5, 5, 6, 6, 5, 6, 6, 5, 5, 4, 9]};
const Q=new URLSearchParams(location.search);
const BUDGET=Math.max(1,+(Q.get('min')||30));
const UNTIL=Q.get('until'), UNTILMS=UNTIL?(()=>{ const [h,m]=UNTIL.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.getTime(); })():null;
const leftNow=tot=>UNTILMS?UNTILMS-Date.now():BUDGET*6e4-tot;
const today=new Date(); today.setHours(12,0,0,0);
const WD=today.getDay(), T=tehToday();
const dateOf=d=>{ const x=new Date(today); x.setDate(x.getDate()-(WD-d)); return x; };
const dayTag=d=>d===WD?'היום':'מיום '+WEEKDAYS[d];
const CURWK=wkId(), dateIn=(wk,d)=>{ if(wk===CURWK) return dateOf(d); const x=weekStart(wk); x.setDate(x.getDate()+d); return x; };
const tagIn=(wk,d)=>wk===CURWK?dayTag(d):'יום '+WEEKDAYS[d]+' '+hebOf(dateIn(wk,d)).label;
const DMN={chumash:'חומש',tanya:'תניא',hayomyom:'היום יום',rambam3:'רמב״ם – ג׳ פרקים',rambam1:'רמב״ם – פרק אחד',sm:'ספר המצוות',halacha:'הלכה יומית',mishna:'משנה',gemara:'גמרא יומית'};
const COL={R:'עמודה ימנית',L:'עמודה שמאלית'};
const UNITS=(Q.get('u')||'').split(',').filter(Boolean).map(x=>{ const [id,w]=x.split('~'); return {id,end:w&&w[0]==='e'?+w.slice(1):null,plan:w&&w[0]!=='e'?+w:null}; });

/* ---------- state (kept across reloads / screen lock) ---------- */
const SIG=isoDate(today)+'|'+(Q.get('u')||'')+'|'+BUDGET;
let S=lsGet('track-v1',null);
if(!S||S.sig!==SIG) S={sig:SIG, cur:0, since:null, items:UNITS.map(u=>({id:u.id,plan:u.plan,end:u.end,f0:u.id==='korb'?0:wkFrac(u.id),f:null,ms:0,st:''}))};
const save=()=>lsSet('track-v1',S);
const runMs=()=>S.since?Date.now()-S.since:0;
const itemMs=i=>S.items[i].ms+(i===S.cur?runMs():0);
const totalMs=()=>S.items.reduce((a,_,i)=>a+itemMs(i),0);
function stopRun(){ if(!S.since) return; const d=Date.now()-S.since; S.items[S.cur].ms+=d; addWeekTime(d); S.since=null; }
function startRun(){ if(!S.since) S.since=Date.now(); }

/* ---------- where each unit is in the printed booklet ---------- */
let DM=null, IDX=null, IDAY=-1; const INFO={}, IDXW={};
const pn=s=>'עמ׳ '+gem(s.p)+(s.col?' ('+COL[s.col]+')':'');
const plab=s=>gem(s.p)+(s.col?(s.col==='R'?' ימין':' שמאל'):'');
function ptText(I,pt){ const s=I.sl[pt.si]; if(pt.kind==='l') return pn(s)+' שורה '+pt.label; if(pt.kind==='p') return pn(s)+', פסוק '+pt.label; return pn(s)+', '+(pt.perek?'פרק '+pt.perek+' ':'')+'הלכה '+pt.label; }
function fromSlices(sl,base,ix){ const U=DM.unitPoints(ix||IDX,sl); const r=Object.assign(base,{sl,W:U.W,segs:U.segs,kind:U.kind,pts:U.pts});
  const st=resumeAt(r,0), en=r.pts.length?ptText(r,r.pts[r.pts.length-1]):pn(sl[sl.length-1]);
  r.where='<b>'+st+'</b>'+(st!==en?' עד <b>'+en+'</b>':''); return r; }
// position text for a fraction of the unit: the reading unit that contains it, or the page / column
function posAt(I,f){ if(!I.sl) return null; if(I.pts&&I.pts.length){ let k=-1; I.pts.forEach((p,j)=>{ if(p.f<=f+0.0005) k=j; }); if(k>=0) return ptText(I,I.pts[k]); }
  let i=I.segs.findIndex(s=>s.b>f+0.0001); if(i<0) i=I.segs.length-1; return pn(I.sl[i]); }
// where to resume: the first unit at or after the fraction
function resumeAt(I,f){ if(I.pts&&I.pts.length){ const p=I.pts.find(p=>p.f>=f-0.002); if(p) return ptText(I,p); } return posAt(I,f); }
const unitsIn=(I,a,b)=>I.pts?I.pts.filter(p=>p.f>=a-0.0005&&p.f<b-0.0005).length:0;
function estimate(I,a,b){ return estMinPrint(I.W*(b-a), I.kind, unitsIn(I,a,b)); }
function info(full){ const [id,wk]=splitWk(full), past=wk!==CURWK; const a=id.split(':');
  const ix=past?IDXW[wk]||null:(IDAY>=0?IDX:null);
  const dmDay=(subj,d)=>{ const D=ix&&ix.subjects[subj]&&ix.subjects[subj].days[d]; return D&&D.label?'מתחיל בכותרת „'+D.label.replace(/\s+/g,' ')+'”':''; };
  if(a[0]==='korb') return {name:'קרבנות למנחה',tag:'מהסידור',where:'מתוך הסידור: <b>פרשת התמיד</b> עד <b>„וערבה לה׳”</b>, ואחר כך אשרי ומנחה',W:KORB_WORDS()};
  if(a[0]==='teh'){ let t=T, dd=null; for(let d=0;d<=(past?6:WD);d++){ const x=tehFor(dateIn(wk,d)); if(x.day===+a[1]){ t=x; dd=d; } }
    return {name:'תהילים',tag:dd!=null?tagIn(wk,dd):'',where:'מתוך ספר התהילים שלך: <b>מזמורים '+t.range+'</b> (יום '+gq(+a[1])+' לחודש)',W:tehWords(+a[1],t.short)||800}; }
  const subj=a[0]==='chu'?'chumash':a[0]==='tan'?'tanya':a[0]==='dm'?a[1]:null;
  const bookTag=past?'מחוברת '+hebOf(weekStart(wk)).label:'מהחוברת';
  if(a[0]==='sec'){ const i=ix?(ix.sections||[]).findIndex(x=>x.from===+a[1]):-1; if(i<0) return {name:'מהחוברת',where:'',W:1000};
    return fromSlices(DM.sectionSlices(ix,i),{name:ix.sections[i].title,tag:bookTag},ix); }
  const d=a[0]==='dm'?(a[2]!=null?+a[2]:(past?0:IDAY)):+a[1];
  const base={name:DMN[subj]||subj,tag:a[2]!=null||a[0]!=='dm'?tagIn(wk,d):''};
  if(ix){ const sl=DM.slices(ix,subj,d); if(sl.length){ const r=fromSlices(sl,base,ix); const lab=dmDay(subj,d); if(lab) r.where+='<br><span style="color:var(--muted);font-size:.9em">'+lab+(past?' – בחוברת של אותו שבוע':'')+'</span>'; return r; } }
  return Object.assign(base,{where:'<span style="color:var(--muted)">'+(past?'החוברת של אותו שבוע לא שמורה – ללמוד מתוך חומש / תניא':'טען את חוברת השבוע כדי לראות באיזה עמוד')+'</span>',W:a[0]==='chu'?900:a[0]==='tan'?700:1500}); }
const goalOf=(it,I)=>it.end!=null?it.end:it.plan?Math.min(1,it.f0+it.plan/I.W):null;

/* ---------- render ---------- */
let pick=-1, pickSl=-1;
function render(){ const box=$('list'); box.innerHTML='';
  S.items.forEach((it,i)=>{ const I=INFO[it.id]; const d=document.createElement('div');
    const done=it.st==='done', part=it.st==='part', cur=i===S.cur&&!done&&!part;
    d.className='it'+(cur?' cur':'')+(done?' done':'')+(part?' part':'');
    const goalF=goalOf(it,I); let est;
    const nU=unitsIn(I,it.f0,goalF||1), uTxt=I.kind&&nU?' · '+nU+' '+(nU===1?UNITNAME[I.kind]:UNITPL[I.kind]):'';
    if(goalF){ est='מתוכנן: כ־'+fmtMin(estimate(I,it.f0,goalF))+' (חלק)'+uTxt; const g=posAt(I,goalF-0.001); if(g) est+=' – עד בערך '+g; }
    else est='משוער: כ־'+fmtMin(estimate(I,it.f0,1))+uTxt;
    let where=I.where||''; if(it.f0>0&&!done){ const s=I.sl?resumeAt(I,it.f0):null; where+=s?'<br>המשך מ־<b>'+s+'</b>':'<br>המשך מהמקום שעצרת ('+Math.round(it.f0*100)+'%)'; }
    const tm=itemMs(i);
    d.innerHTML='<div class="hd"><div class="n">'+(done?'✓':part?'½':gem(i+1))+'</div><h2>'+I.name+(I.tag?' <em>· '+I.tag+'</em>':'')+'</h2><div class="t">'+(tm||cur?mmss(tm):'')+'</div></div>'+
      (done||part?'<div class="est">'+(done?'הושלם':'נעצר ב'+(I.sl?posAt(I,Math.max(0,(it.f||0)-0.001)):'־'+Math.round((it.f||0)*100)+'%'))+(tm?' · '+fmtMin(tm/6e4):'')+'</div>':'<div class="where">'+where+'</div><div class="est">'+est+'</div>');
    if(cur){ const ac=document.createElement('div'); ac.className='acts';
      ac.innerHTML='<button class="ok">✓ סיימתי</button><button class="st">עצרתי באמצע…</button><button class="sk">דלג</button>'; d.appendChild(ac);
      ac.querySelector('.ok').onclick=()=>finish(i,1);
      ac.querySelector('.st').onclick=()=>{ pick=pick===i?-1:i; pickSl=-1; render(); };
      ac.querySelector('.sk').onclick=()=>{ const r=!!S.since; stopRun(); S.cur=next(i); pick=-1; if(r) startRun(); save(); render(); };
      if(pick===i) d.appendChild(picker(i,it,I,goalF)); }
    else if(!done&&!part){ d.onclick=()=>{ const r=!!S.since; stopRun(); S.cur=i; pick=-1; if(r) startRun(); save(); render(); }; d.style.cursor='pointer'; }
    box.appendChild(d); });
  if(S.items.every(it=>it.st)){ const tot=totalMs(), dn=S.items.filter(it=>it.st==='done').length; const s=document.createElement('div'); s.className='sum';
    const P=unitPace(); const pc=Object.keys(UNITNAME).filter(k=>P[k]).map(k=>UNITNAME[k]+' – '+(P[k]>=60?Math.floor(P[k]/60)+':'+String(P[k]%60).padStart(2,'0')+' דק׳':P[k]+' שנ׳')).join(' · ');
    s.innerHTML='<h3>סיום ✓</h3>למדת <b>'+fmtMin(tot/6e4)+'</b> · '+[dn?(dn===1?'חלק אחד הושלם':dn+' חלקים הושלמו'):'', S.items.length>dn?(S.items.length-dn===1?'חלק אחד יימשך':(S.items.length-dn)+' חלקים יימשכו')+' בפעם הבאה מהמקום שעצרת':''].filter(Boolean).join(', ')+'.<br>זמן לימוד השבוע: <b>'+fmtMin(weekTime()/6e4)+'</b>'+
      (pc?'<br><span style="color:var(--muted);font-size:.9em">הקצב שלך בממוצע: '+pc+'. התוכניות הבאות יחושבו לפי זה.</span>':'');
    const lm=leftNow(tot); if(lm>=2.5*6e4){ const m=Math.floor(lm/6e4); const o=document.createElement('div'); o.className='sum'; o.style.borderColor='var(--gold)';
      o.innerHTML='סיימת לפני הזמן! נשארו עוד <b style="color:var(--gold)">'+m+' דק׳</b>. תרצה ללמוד עוד קטע?<div class="acts"><button class="ok">כן, תכין לי עוד</button></div>';
      o.querySelector('.ok').onclick=()=>{ location.href='index.html?go=1&min='+m+(UNTIL?'&until='+UNTIL:''); }; box.appendChild(s); box.appendChild(o); } else box.appendChild(s); }
  tick(); }
// "where did you stop?" – first the page, then the line / verse / halacha on it
function picker(i,it,I,goalF){ const pg=document.createElement('div'); pg.className='pages';
  const btn=(txt,fn,cls)=>{ const b=document.createElement('button'); b.textContent=txt; if(cls) b.className=cls; b.onclick=fn; pg.appendChild(b); return b; };
  const note=t=>{ const p=document.createElement('p'); p.textContent=t; pg.appendChild(p); };
  if(!I.sl){ note('כמה מהחלק הספקת?'); [0.25,0.5,0.75].forEach(f=>{ if(f>it.f0) btn(Math.round(f*100)+'%',()=>finish(i,f)); }); return pg; }
  note('באיזה עמוד עצרת?');
  I.segs.forEach((sg,k)=>{ if(sg.b<=it.f0+0.001) return; const b=btn(plab(I.sl[k])+' ›',()=>{ pickSl=pickSl===k?-1:k; render(); }, goalF&&goalF>sg.a&&goalF<=sg.b+0.001?'goal':''); if(pickSl===k) b.style.borderColor='var(--ink)'; });
  const sg=I.segs[pickSl]; if(!sg) return pg;
  const pts=(I.pts||[]).map((p,j)=>({p,j})).filter(x=>x.p.si===pickSl);
  const endOf=j=>j+1<I.pts.length?I.pts[j+1].f:1;
  if(pts.length){ note('עמ׳ '+plab(I.sl[pickSl])+' – עד איזה'+(I.kind==='h'?'ו הלכה':I.kind==='p'?' פסוק':'ו שורה')+' למדת (כולל)?');
    let lastPerek=null;
    pts.forEach(({p,j})=>{ const f=endOf(j); if(f<=it.f0+0.001) return;
      if(I.kind==='h'&&p.perek&&p.perek!==lastPerek){ lastPerek=p.perek; note('פרק '+p.perek); }
      const b=btn(I.kind==='p'?'פסוק '+p.label:p.label,()=>finish(i,f)); b.style.minWidth='calc(42px*var(--k))'; }); }
  else { note('עמ׳ '+plab(I.sl[pickSl])+' – כמה מהעמוד?'); [[0.25,'רבע'],[0.5,'חצי'],[0.75,'שלושה רבעים'],[1,'כולו']].forEach(([x,t])=>{ const f=sg.a+(sg.b-sg.a)*x; if(f>it.f0+0.001) btn(t,()=>finish(i,f)); }); }
  return pg; }
const next=i=>{ for(let k=1;k<=S.items.length;k++){ const j=(i+k)%S.items.length; if(!S.items[j].st) return j; } return i; };
function finish(i,f){ const it=S.items[i], I=INFO[it.id]; const run=!!S.since; stopRun();
  it.f=Math.max(it.f0,f); it.st=f>=0.999?'done':'part'; wkSet(it.id,it.f,true);
  if(I.kind) learnUnitPace(I.kind, unitsIn(I,it.f0,it.f>=0.999?1.01:it.f), it.ms); else learnPrintWpm((it.f-it.f0)*I.W, it.ms);
  if(it.id==='chu:'+WD) setProgress('chumash',isoDate(today),it.f); if(it.id==='tan:'+WD) setProgress('tanya',isoDate(today),it.f); if(it.id==='teh:'+T.day) setProgress('tehillim',T.key,it.f);
  if(it.id==='korb') setProgress('korbanot',isoDate(today),it.f);
  pick=-1; pickSl=-1; S.cur=next(i); if(run && f>=0.999 && !S.items[S.cur].st) startRun(); save(); render(); }
const mmss=ms=>{ const neg=ms<0; ms=Math.abs(ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600); return (neg?'-':'')+(h?h+':'+String(Math.floor(s/60)%60).padStart(2,'0'):Math.floor(s/60))+':'+String(s%60).padStart(2,'0'); };
function tick(){ const tot=totalMs(), left=leftNow(tot);
  $('clock').textContent=mmss(left); $('clockBox').classList.toggle('over',left<0);
  $('clockLbl').textContent=UNTIL?(left>=0?'נותרו עד '+UNTIL:'עברה השעה '+UNTIL):left>=0?'נותרו מתוך '+fmtMin(BUDGET):'עבר הזמן שתכננת';
  $('fill').style.width=Math.min(100,tot/(BUDGET*6e4)*100)+'%';
  const allDone=S.items.every(it=>it.st);
  $('play').textContent=allDone?'חזרה למסך הבית':S.since?'⏸ השהה':(tot?'המשך ▶':'התחל ▶'); $('play').classList.toggle('run',!!S.since);
  const ce=document.querySelector('.it.cur .t'); if(ce) ce.textContent=mmss(itemMs(S.cur));
  $('sub').textContent='זמן שלמדת עכשיו: '+fmtMin(tot/6e4); }
$('play').onclick=()=>{ if(S.items.every(it=>it.st)){ location.href='./'; return; } if(S.since) stopRun(); else startRun(); save(); tick(); };
setInterval(tick,1000);
addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{ save(); tick(); });

/* ---------- load ---------- */
(async()=>{
  try{ DM=await import('./dm.js?v=bbce6dfa'); const m=await DM.loadStored(); if(m){ IDX=m.index; IDAY=m.wk===CURWK?DM.dayForLabel(IDX,hebOf(today).label):-1; }
    for(const w of new Set(S.items.map(it=>splitWk(it.id)[1]).filter(w=>w!==CURWK))){ const b=await DM.loadStored(null,w); if(b) IDXW[w]=b.index; } }catch(e){}
  S.items.forEach(it=>{ INFO[it.id]=info(it.id); });
  if(!S.items.length){ $('list').innerHTML='<div class="msg">אין מה ללמוד בתוכנית. <a href="./" style="color:var(--gold)">חזרה למסך הבית</a></div>'; return; }
  render(); })();
</script>
