    if(goalF){ est='מתוכנן: כ־'+fmtMin(estimate(I,it.f0,goalF))+' (חלק)'+uTxt; const g=posAt(I,goalF-0.001); if(g) est+=' – עד בערך '+g; }
    else est='משוער: כ־'+fmtMin(estimate(I,it.f0,1))+uTxt;
    let where=I.where||''; if(it.f0>0&&!done) where+='<br><span style="color:var(--muted)">נלמד עד כה: '+cntTxt(I,it.f0)+'</span>'; if(it.f0>0&&!done){ const s=I.sl?resumeAt(I,it.f0):null; where+=s?'<br>המשך מ־<b>'+s+'</b>':'<br>המשך מהמקום שעצרת ('+Math.round(it.f0*100)+'%)'; }
    const tm=itemMs(i);
    d.innerHTML='<div class="hd"><div class="n">'+(done?'✓':part?'½':gem(i+1))+'</div><h2>'+I.name+(I.tag?' <em>· '+I.tag+'</em>':'')+'</h2><div class="t">'+(tm||cur?mmss(tm):'')+'</div></div>'+
      (done||part?'<div class="est">'+(done?'הושלם':'נעצר ב'+(I.sl?posAt(I,Math.max(0,(it.f||0)-0.001)):'־'+Math.round((it.f||0)*100)+'%'))+' · '+cntTxt(I,done?1:(it.f||0))+(tm?' · '+fmtMin(tm/6e4):'')+'</div>':'<div class="where">'+where+'</div><div class="est">'+est+'</div>');
    if(cur){ const ac=document.createElement('div'); ac.className='acts';
      ac.innerHTML='<button class="ok">✓ סיימתי</button><button class="st">עצרתי באמצע…</button><button class="sk">דלג</button>'; d.appendChild(ac);
      ac.querySelector('.ok').onclick=()=>finish(i,1);
      ac.querySelector('.st').onclick=()=>{ pick=pick===i?-1:i; pickSl=-1; render(); };
      ac.querySelector('.sk').onclick=()=>{ const r=!!S.since; stopRun(); S.cur=next(i); pick=-1; if(r) startRun(); save(); render(); };
      if(pick===i) d.appendChild(picker(i,it,I,goalF)); }
    else if(!done&&!part){ d.onclick=()=>{ const r=!!S.since; stopRun(); S.cur=i; pick=-1; if(r) startRun(); save(); render(); }; d.style.cursor='pointer'; }
    box.appendChild(d); });
  if(S.items.every(it=>it.st)){ const tot=totalMs(), dn=S.items.filter(it=>it.st==='done').length; const s=document.createElement('div'); s.className='sum';
    const P=unitPace(); const pc=Object.keys(UNITNAME).filter(k=>P[k]).map(k=>UNITNAME[k]+' – '+(P[k]>=60?Math.floor(P[k]/60)+':'+String(P[k]%60).padStart(2,'0')+' דק׳':P[k]+' שנ׳')).join(' · ');
    s.innerHTML='<h3>סיום ✓</h3>למדת <b>'+fmtMin(tot/6e4)+'</b> · '+[dn?(dn===1?'חלק אחד הושלם':dn+' חלקים הושלמו'):'', S.items.length>dn?(S.items.length-dn===1?'חלק אחד יימשך':(S.items.length-dn)+' חלקים יימשכו')+' בפעם הבאה מהמקום שעצרת':''].filter(Boolean).join(', ')+'.<br>זמן לימוד השבוע: <b>'+fmtMin(weekTime()/6e4)+'</b>'+
      (pc?'<br><span style="color:var(--muted);font-size:.9em">הקצב שלך בממוצע: '+pc+'. התוכניות הבאות יחושבו לפי זה.</span>':'');
    const lm=leftNow(tot); if(lm>=2.5*6e4){ const m=Math.floor(lm/6e4); const o=document.createElement('div'); o.className='sum'; o.style.borderColor='var(--gold)';
      o.innerHTML='סיימת לפני הזמן! נשארו עוד <b style="color:var(--gold)">'+m+' דק׳</b>. תרצה ללמוד עוד קטע?<div class="acts"><button class="ok">כן, תכין לי עוד</button></div>';
      o.querySelector('.ok').onclick=()=>{ location.href='index.html?go=1&min='+m+(UNTIL?'&until='+UNTIL:''); }; box.appendChild(s); box.appendChild(o); } else box.appendChild(s); }
  tick(); }
// "where did you stop?" – first the page, then the line / verse / halacha on it
function picker(i,it,I,goalF){ const pg=document.createElement('div'); pg.className='pages';
  const btn=(txt,fn,cls)=>{ const b=document.createElement('button'); b.textContent=txt; if(cls) b.className=cls; b.onclick=fn; pg.appendChild(b); return b; };
  const note=t=>{ const p=document.createElement('p'); p.textContent=t; pg.appendChild(p); };
  if(!I.sl){ note('כמה מהחלק הספקת?'); [0.25,0.5,0.75].forEach(f=>{ if(f>it.f0) btn(Math.round(f*100)+'%',()=>finish(i,f)); }); return pg; }
  note('באיזה עמוד עצרת?');
  I.segs.forEach((sg,k)=>{ if(sg.b<=it.f0+0.001) return; const b=btn(plab(I.sl[k])+' ›',()=>{ pickSl=pickSl===k?-1:k; render(); }, goalF&&goalF>sg.a&&goalF<=sg.b+0.001?'goal':''); if(pickSl===k) b.style.borderColor='var(--ink)'; });
  const sg=I.segs[pickSl]; if(!sg) return pg;
  const pts=(I.pts||[]).map((p,j)=>({p,j})).filter(x=>x.p.si===pickSl);
  const endOf=j=>j+1<I.pts.length?I.pts[j+1].f:1;
  if(pts.length){ note('עמ׳ '+plab(I.sl[pickSl])+' – עד איזה'+(I.kind==='h'?'ו הלכה':I.kind==='p'?' פסוק':'ו שורה')+' למדת (כולל)?');
    let lastPerek=null;
    pts.forEach(({p,j})=>{ const f=endOf(j); if(f<=it.f0+0.001) return;
      if(I.kind==='h'&&p.perek&&p.perek!==lastPerek){ lastPerek=p.perek; note('פרק '+p.perek); }
      const b=btn(I.kind==='p'?'פסוק '+p.label:p.label,()=>finish(i,f)); b.style.minWidth='calc(42px*var(--k))'; }); }
  else { note('עמ׳ '+plab(I.sl[pickSl])+' – כמה מהעמוד?'); [[0.25,'רבע'],[0.5,'חצי'],[0.75,'שלושה רבעים'],[1,'כולו']].forEach(([x,t])=>{ const f=sg.a+(sg.b-sg.a)*x; if(f>it.f0+0.001) btn(t,()=>finish(i,f)); }); }
  return pg; }
const next=i=>{ for(let k=1;k<=S.items.length;k++){ const j=(i+k)%S.items.length; if(!S.items[j].st) return j; } return i; };
function finish(i,f){ const it=S.items[i], I=INFO[it.id]; const run=!!S.since; stopRun();
  it.f=Math.max(it.f0,f); it.st=f>=0.999?'done':'part'; wkSet(it.id,it.f,true);
  if(I.kind) learnUnitPace(I.kind, unitsIn(I,it.f0,it.f>=0.999?1.01:it.f), it.ms); else learnPrintWpm((it.f-it.f0)*I.W, it.ms);
  if(it.id==='chu:'+WD) setProgress('chumash',isoDate(today),it.f); if(it.id==='tan:'+WD) setProgress('tanya',isoDate(today),it.f); if(it.id==='teh:'+T.day) setProgress('tehillim',T.key,it.f);
  if(it.id==='korb') setProgress('korbanot',isoDate(today),it.f);
  pick=-1; pickSl=-1; S.cur=next(i); if(run && f>=0.999 && !S.items[S.cur].st) startRun(); save(); render(); }
const mmss=ms=>{ const neg=ms<0; ms=Math.abs(ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600); return (neg?'-':'')+(h?h+':'+String(Math.floor(s/60)%60).padStart(2,'0'):Math.floor(s/60))+':'+String(s%60).padStart(2,'0'); };
function tick(){ const tot=totalMs(), left=leftNow(tot);
  $('clock').textContent=mmss(left); $('clockBox').classList.toggle('over',left<0);
  $('clockLbl').textContent=UNTIL?(left>=0?'נותרו עד '+UNTIL:'עברה השעה '+UNTIL):left>=0?'נותרו מתוך '+fmtMin(BUDGET):'עבר הזמן שתכננת';
  $('fill').style.width=Math.min(100,tot/(BUDGET*6e4)*100)+'%';
  const allDone=S.items.every(it=>it.st);
  $('play').textContent=allDone?'חזרה למסך הבית':S.since?'⏸ השהה':(tot?'המשך ▶':'התחל ▶'); $('play').classList.toggle('run',!!S.since);
  const ce=document.querySelector('.it.cur .t'); if(ce) ce.textContent=mmss(itemMs(S.cur));
  $('sub').textContent='זמן שלמדת עכשיו: '+fmtMin(tot/6e4); }
$('play').onclick=()=>{ if(S.items.every(it=>it.st)){ location.href='./'; return; } if(S.since) stopRun(); else startRun(); save(); tick(); };
setInterval(tick,1000);
addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{ save(); tick(); });

/* ---------- load ---------- */
(async()=>{
  try{ DM=await import('./dm.js?v=dd40aa0e'); const m=await DM.loadStored(); if(m){ IDX=m.index; IDAY=m.wk===CURWK?DM.dayForLabel(IDX,hebOf(today).label):-1; }
    for(const w of new Set(S.items.map(it=>splitWk(it.id)[1]).filter(w=>w!==CURWK))){ const b=await DM.loadStored(null,w); if(b) IDXW[w]=b.index; } }catch(e){}
  S.items.forEach(it=>{ INFO[it.id]=info(it.id); });
  if(!S.items.length){ $('list').innerHTML='<div class="msg">אין מה ללמוד בתוכנית. <a href="./" style="color:var(--gold)">חזרה למסך הבית</a></div>'; return; }
  render(); })();
</script>
